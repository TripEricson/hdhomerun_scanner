# HDHomeRun Scanner Configuration File
# Lines starting with # are comments
#
# This is the default configuration file (scanner.conf)
# You can create multiple config files for different scanning scenarios

# Tuner identification
# Use FFFFFFFF to auto-discover the first available tuner
# Or specify the exact 8-digit hex ID of your tuner
tuner_id=FFFFFFFF

# Which tuner on the device to use (0, 1, 2, etc.)
# Most devices have 2-4 tuners
tuner_index=1

# Channel scanning range
# Set these to match your local TV band
# North America: typically 2-69
min_channel=2
max_channel=36

# Whether to use the device's channel map instead of scanning sequentially
# If true, will use the tuner's configured channel map
# If false or if channel map is unavailable, will scan min_channel to max_channel
use_channel_map=false

# URL to submit scan results to
# Default is rabbitears.info, but you could change this for testing
spot_url=http://www.rabbitears.info/tvdx/raw_spot

# User agent string for HTTP requests
user_agent=HDHomeRun Scanner C/1.0

# How long to wait for a channel to lock (in seconds)
# ATSC 3.0 channels may need longer lock times
seek_timeout=3.0

# How long to wait for PSIP (virtual channel) data after lock (in seconds)
# Increase this if virtual channel information is incomplete
psip_wait_time=2
atsc3_psip_wait_time=10

# How long to wait between complete scans (in seconds)
# The original Perl script ran continuously, rescanning periodically
retry_delay=5

# Enable debug output
# Set to true to see detailed information about the scanning process
debug=false

# Override fields (optional)
# These can be used to identify your scanner location to rabbitears.info
# Leave empty if not needed
override_channel=

# Example configurations for different scenarios:

# For testing with debug output:
# debug=true
# retry_delay=30
# min_channel=30
# max_channel=35

# For a specific tuner on a multi-tuner device:
# tuner_id=12345678
# tuner_index=1

# For scanning only UHF channels:
# min_channel=14
# max_channel=69

# For scanning only VHF-Hi channels:
# min_channel=7
# max_channel=13
